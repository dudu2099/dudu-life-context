<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">隐私：哪些记，哪些不记</title>
<desc id="desc">三个色块栏。绿色「可以记」：账号的平台名和用途、自己产品的公开定价、不带数字的说法。黄色「默认不记」：健康、感情、家庭矛盾，报告里只说看到了、没记，你说要记才写并标成私密。红色「任何时候不记」：证件号、密码、密钥、账号凭据，个人收入存款负债报酬的具体数字。底部一行：隐私过滤是 AI 判断加脚本兜底，不是保证。</desc>
